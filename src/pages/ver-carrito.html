<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/src/public/img/favicon-nb.png" type="image/png">
    <link rel="stylesheet" href="/src/css/navbar.css">
    <link rel="stylesheet" href="/src/css/catalogo.css">
    <link rel="stylesheet" href="/src/css/verCarrito.css">
    <link rel="stylesheet" href="/src/css/footer.css">
    

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css">
    <title>Ver Carrito</title>
</head>

<body>
    <header id="navbar"></header>
    <main>
        <h1 class="text-center mt-5">Canasta de compras</h1>
        <div id="descrCarrito" class="container-fluid container-lg mx-auto px-lg-2 px-3 my-5">
            <div class="row gap-3">
                <div id="prodCarrito" class="prodCarrito col-lg-7 rounded-3 py-3 px-5">

                </div>
                <div id="facturaCarrito" class="col-lg-4 col-12 my-auto mx-auto p-0">
                    <div id="valorCarrito" class="valorCarrito col-12 rounded-3 m-0 my-auto 
                rounded-3 border border-2 border-dark-subtle pt-3">
                    </div>
                    <button id="irPago" class="btn btn-warning mt-3 w-100"
                        onclick="window.location.href='/src/pages/pago.html'">Ir a pagar</button>
                    <button id="cancelar" class="btn btn-danger mt-3 w-100"
                        onclick="window.location.href='/src/pages/catalogo.html'">Cancelar</button>
                </div>
            </div>
        </div>

        <!--seccion destacados-->
            <div class="titulo-destacados ">
                <h2 id="destacados">¿Un último antojito?</h2>
            </div>
            <div class="row my-4 mx-lg-4 mx-1">
                <div class="col-md-4 col-12 mb-3">
                    <div class="destacado">
                        <a href="/src/pages/catalogo.html?categoria=cafe">
                            <img id="cafe-destacado" src="/src/public/img/LA-MARIA.webp" alt="cafe destacado la maria">
                            <h3 id="destacado-1">¿Un cafecito?</h3>
                        </a>

                    </div>
                </div>
                <div class="col-md-4 col-12 mb-3">
                    <div class="destacado">
                        <a href="/src/pages/catalogo.html?categoria=cacao">
                            <img id="chocolate-destacado" src="/src/public/img/LAS-NIÑAS.webp"
                                alt="chocolate destacado las niñas">
                            <h3 id="destacado-2">¿Un chocolatico?</h3>
                        </a>
                    </div>
                </div>
                <div class="col-md-4 col-12 mb-3">
                    <div class="destacado">
                        <a href="/src/pages/catalogo.html?categoria=cerveza">
                            <img id="cerveza-destacada" src="/src/public/img/LA-ROJA.webp" alt="cerveza la roja">
                            <h3 id="destacado-3">¿Cerveza para la sed?</h3>
                        </a>
                    </div>
                </div>
            </div>

    </main>
    <footer id="footer"></footer>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/src/js/dataBase.js"></script>
<script src="/src/js/api.js"></script>
<script src="/src/js/navbar.js"></script>
<script src="/src/js/verCarrito.js"></script>
<script src="/src/js/footer.js"></script>


</html>
